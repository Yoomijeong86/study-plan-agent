<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>수학 왕국 RPG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=IBM+Plex+Sans+KR:wght@400;500;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap">
<style>
/* Layout: 바다 해도 — 단원 섬들이 점선 항로로 이어진 세로 지도, 전투는 몬스터(위) → 문제 → 답(아래) 한 줄 흐름 */
:root {
  --sea: #DCEBE8; --sea-2: #CDE2DE; --foam: #EDF5F3; --paper: #F9FCFB;
  --ink: #10243A; --ink-2: #4A6070; --line: rgba(16, 36, 58, .14);
  --coral: #D9481F; --on-coral: #FFFFFF; --coral-soft: #FBDCD0;
  --gold: #A87400; --gold-fill: #F2B705; --gold-soft: #FFEDB3;
  --hp: #E0383E; --good: #12805B; --good-soft: #D3F0E3; --bad: #C2332F; --bad-soft: #FBE1DF;
  --sil: #B9CBC8; --smoke: #C6CDD0; --route: rgba(16, 36, 58, .3); --scrim: rgba(6, 16, 24, .45);
  --f-disp: 'Bagel Fat One', 'Black Han Sans', 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif;
  --f-body: 'IBM Plex Sans KR', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --f-math: 'STIX Two Text', 'Cambria Math', 'Times New Roman', serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sea: #0B1A23; --sea-2: #0F222D; --foam: #19323F; --paper: #132A35;
    --ink: #E4F0EE; --ink-2: #9DB3BA; --line: rgba(228, 240, 238, .14);
    --coral: #FF7C55; --on-coral: #1C0C05; --coral-soft: #4A2317;
    --gold: #FFC93C; --gold-fill: #FFC93C; --gold-soft: #3B300D;
    --hp: #FF5F66; --good: #3CCF96; --good-soft: #0E3A2B; --bad: #FF7A73; --bad-soft: #421A1B;
    --sil: #2B4550; --smoke: #5C6B72; --route: rgba(228, 240, 238, .26); --scrim: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sea: #0B1A23; --sea-2: #0F222D; --foam: #19323F; --paper: #132A35;
  --ink: #E4F0EE; --ink-2: #9DB3BA; --line: rgba(228, 240, 238, .14);
  --coral: #FF7C55; --on-coral: #1C0C05; --coral-soft: #4A2317;
  --gold: #FFC93C; --gold-fill: #FFC93C; --gold-soft: #3B300D;
  --hp: #FF5F66; --good: #3CCF96; --good-soft: #0E3A2B; --bad: #FF7A73; --bad-soft: #421A1B;
  --sil: #2B4550; --smoke: #5C6B72; --route: rgba(228, 240, 238, .26); --scrim: rgba(0, 0, 0, .55);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background-color: var(--sea); color: var(--ink); font: 15px/1.6 var(--f-body);
  background-image: radial-gradient(circle at 50% 100%, transparent 8px, var(--sea-2) 8.5px, var(--sea-2) 9.5px, transparent 10px);
  background-size: 30px 15px; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .45; }
:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
h1, h2 { font-family: var(--f-disp); font-weight: 400; text-wrap: balance; margin: 0; letter-spacing: .01em; }
h1 { font-size: 26px; line-height: 1.2; }
h2 { font-size: 20px; line-height: 1.25; }
p { margin: 0; }
b { font-weight: 700; }
.muted { color: var(--ink-2); }
.center { text-align: center; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--ink-2); font-weight: 500; }
.sub { color: var(--ink-2); font-size: 13.5px; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.sub .ic { width: 15px; height: 15px; fill: var(--gold-fill); stroke: var(--gold-fill); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.col { flex-direction: column; align-items: stretch; }

/* 수식 */
.mx { font-family: var(--f-math); font-size: 1.1em; }
.mx i { font-style: italic; }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; line-height: 1.12; margin: 0 .1em; font-size: .9em; }
.fr > span { padding: 0 .18em; }
.fr > span:first-child { border-bottom: 1.4px solid currentColor; }
sup { font-size: .68em; line-height: 0; }
.ov { text-decoration: overline; }
.data { display: block; margin: 10px 0 2px; padding: 10px 12px; background: var(--foam); border-radius: 12px; text-align: center; font-size: 1.06em; overflow-x: auto; line-height: 1.9; }
.data .mx { font-size: 1.12em; }

/* 버튼 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 18px; border-radius: 14px; border: 0; background: var(--coral); color: var(--on-coral); font-weight: 700; font-size: 15px; }
.btn .ic { width: 18px; height: 18px; }
.btn.big { min-height: 52px; font-size: 17px; flex: 1; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: 11px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.danger { background: var(--bad); color: var(--on-coral); }
.link { background: none; border: 0; color: var(--coral); font-weight: 700; padding: 6px 0; text-decoration: underline; text-underline-offset: 3px; }
.icon-btn { width: 42px; height: 42px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); display: grid; place-items: center; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--gold-soft); color: var(--gold); }
.pill .ic { width: 16px; height: 16px; }
.pill.done { background: var(--good-soft); color: var(--good); }
.bar { height: 10px; border-radius: 99px; background: var(--foam); overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--coral); border-radius: 99px; transition: width .5s; }

/* HUD + 내비 */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hud-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding-block: 8px; }
.avatar { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--coral); background: var(--coral-soft); color: var(--coral); display: grid; place-items: center; flex: none; }
.avatar .ic { width: 24px; height: 24px; }
.who { flex: 1; min-width: 0; }
.who .nm { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who .lv { font-family: var(--f-disp); font-weight: 400; color: var(--coral); font-size: 14px; margin-left: 2px; }
.who .ttl { font-size: 12px; color: var(--ink-2); line-height: 1.3; }
.xpbar { height: 6px; border-radius: 9px; background: var(--foam); margin-top: 4px; overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--gold-fill); border-radius: 9px; }
.res { display: flex; gap: 6px; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 3px; padding: 4px 9px; border-radius: 999px; background: var(--foam); font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.chip b { color: var(--ink); }
.chip .ic { width: 16px; height: 16px; }
.chip.gold .ic { color: var(--gold); }
.chip.fire .ic { color: var(--coral); fill: var(--coral-soft); }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--paper); border-top: 1px solid var(--line); display: flex; justify-content: center; padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.nav button { flex: 1; max-width: 112px; background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 0; color: var(--ink-2); font-size: 11.5px; font-weight: 500; position: relative; }
.nav button .ic { width: 23px; height: 23px; }
.nav button.on { color: var(--coral); }
.nav em { position: absolute; top: -1px; left: calc(50% + 6px); font-style: normal; background: var(--coral); color: var(--on-coral); font-size: 10.5px; font-weight: 700; min-width: 18px; height: 18px; line-height: 18px; border-radius: 9px; padding: 0 5px; }
.page { max-width: 560px; margin: 0 auto; padding-top: 14px; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }

/* 지도 */
.intro { border: 2px solid var(--coral); }
.intro p { color: var(--ink-2); }
.quest .q-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.quest .q-num { font-size: 12.5px; color: var(--ink-2); text-align: right; margin-top: -4px; font-variant-numeric: tabular-nums; }
.quest .bar > i { background: var(--gold-fill); }
.chart { position: relative; display: flex; flex-direction: column; gap: 2px; padding: 4px 0 8px; }
.chart::before { content: ""; position: absolute; left: 50%; top: 10px; bottom: 30px; border-left: 3px dashed var(--route); transform: translateX(-50%); }
.sea-lbl { position: relative; align-self: center; margin: 10px 0 4px; padding: 3px 14px; background: var(--sea); border: 1.5px solid var(--route); border-radius: 999px; font-size: 12.5px; letter-spacing: .12em; color: var(--ink-2); font-weight: 700; }
.isl { position: relative; display: flex; align-items: center; gap: 2px; width: min(100%, 420px); background: none; border: 0; padding: 0; text-align: left; }
.isl.l { align-self: flex-start; }
.isl.r { align-self: flex-end; flex-direction: row-reverse; text-align: right; }
.isl.final { align-self: center; flex-direction: column; text-align: center; width: min(100%, 340px); }
.isl.final .isl-txt { align-items: center; }
.isl.locked .isl-art { filter: grayscale(.9) opacity(.6); }
.isl-art { width: 128px; height: auto; flex: none; transition: transform .2s; }
.isl-art.sm { width: 92px; }
.isl:hover .isl-art { transform: translateY(-3px) rotate(-1deg); }
.isl-txt { display: flex; flex-direction: column; min-width: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; box-shadow: 0 3px 0 color-mix(in srgb, var(--isl) 50%, transparent); }
.isl.r .isl-txt { align-items: flex-end; }
.isl-no { font-family: var(--f-math); font-weight: 600; font-size: 13px; color: var(--isl); line-height: 1.2; }
.isl-nm { font-family: var(--f-disp); font-size: 17px; line-height: 1.25; }
.isl-unit { font-size: 12.5px; color: var(--ink-2); line-height: 1.35; }
.isl-meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; margin-top: 3px; align-items: center; }
.isl.r .isl-meta { justify-content: flex-end; }
.isl-meta .st { display: inline-flex; align-items: center; gap: 2px; font-weight: 700; font-variant-numeric: tabular-nums; }
.isl-meta .st .ic { width: 14px; height: 14px; fill: var(--gold-fill); stroke: var(--gold-fill); }
.isl-meta .crown { color: var(--gold); font-weight: 700; }
.isl-meta .ac { color: var(--ink-2); }

/* 섬 */
.isl-head { display: flex; align-items: center; gap: 10px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; box-shadow: inset 0 -5px 0 var(--isl); }
.isl-head > div { min-width: 0; }
.isl-head h1 { font-size: 22px; }
.stages { display: flex; flex-direction: column; gap: 10px; }
.stage { display: flex; align-items: center; gap: 10px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px 8px 8px; text-align: left; width: 100%; }
.stage:hover { border-color: var(--isl); }
.s-mon { width: 64px; height: 64px; flex: none; border-radius: 14px; background: var(--foam); display: grid; place-items: center; }
.s-mon .mon { width: 58px; height: 58px; }
.s-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.s-no { font-size: 11.5px; color: var(--ink-2); letter-spacing: .06em; }
.s-nm { font-weight: 700; font-size: 16px; line-height: 1.3; }
.s-mn { font-size: 12.5px; color: var(--ink-2); }
.s-st { display: flex; gap: 1px; flex: none; }
.s-st .ic { width: 18px; height: 18px; stroke: var(--line); }
.s-st i.on .ic { fill: var(--gold-fill); stroke: var(--gold-fill); }
.stage.boss { border: 2px solid var(--isl); }
.stage.boss .s-nm { font-family: var(--f-disp); font-weight: 400; }
.stage.locked { border-style: dashed; border-color: var(--line); }
.stage.locked .s-nm { color: var(--ink-2); }
.s-lock { color: var(--ink-2); }

/* 오답노트 / 도감 / 기록 / 상점 */
.pg-head { display: flex; flex-direction: column; gap: 8px; }
.pg-head p { color: var(--ink-2); }
.empty { align-items: center; text-align: center; }
.empty .em-art .mon { width: 110px; height: 110px; }
.empty p { color: var(--ink-2); max-width: 34ch; }
.notes { display: flex; flex-direction: column; gap: 12px; }
.note { background: var(--paper); border: 1px solid var(--line); border-left: 5px solid var(--isl); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.n-top { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--foam); color: var(--ink-2); }
.n-date { color: var(--ink-2); margin-left: auto; }
.fix { display: inline-flex; gap: 3px; }
.fix i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--good); }
.fix i.on { background: var(--good); }
.n-q { font-size: 14.5px; }
.n-ans { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.lbl { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 6px; margin-right: 6px; }
.lbl.bad { background: var(--bad-soft); color: var(--bad); }
.lbl.good { background: var(--good-soft); color: var(--good); }
details summary { cursor: pointer; color: var(--coral); font-weight: 700; font-size: 13.5px; }
.steps { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.steps li { padding-left: 2px; }
.dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.dx { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 8px 6px 10px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 1px; }
.dx .mon { width: 78px; height: 78px; }
.dx b { font-size: 13px; line-height: 1.3; }
.dx span { font-size: 11px; color: var(--ink-2); line-height: 1.3; }
.dx.no b { color: var(--ink-2); }
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 520px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
.tile { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; }
.tile span { font-size: 12.5px; color: var(--ink-2); }
.tile b { font-family: var(--f-disp); font-weight: 400; font-size: 26px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.tile small { font-family: var(--f-body); font-size: 13px; color: var(--ink-2); }
.bars { display: flex; flex-direction: column; gap: 10px; }
.br { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; align-items: center; }
.b-nm { font-size: 13.5px; font-weight: 500; }
.b-v { font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.b-v small { color: var(--ink-2); }
.b-track { grid-column: 1 / -1; height: 10px; border-radius: 9px; background: var(--foam); overflow: hidden; }
.b-track i { display: block; height: 100%; background: var(--isl); border-radius: 9px; }
.weak { display: flex; flex-direction: column; gap: 8px; }
.wk { display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: 10px 12px; border-radius: 12px; background: var(--foam); border-left: 4px solid var(--isl); }
.wk div { display: flex; flex-direction: column; min-width: 0; }
.wk span { font-size: 12.5px; color: var(--ink-2); }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 4px 0; border-top: 1px solid var(--line); padding-top: 10px; }
.set-row:first-of-type { border-top: 0; }
.shop { display: flex; flex-direction: column; gap: 10px; }
.item { display: flex; align-items: center; gap: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.it-ic { width: 48px; height: 48px; border-radius: 14px; background: var(--gold-soft); color: var(--gold); display: grid; place-items: center; flex: none; }
.it-ic .ic { width: 26px; height: 26px; }
.it-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.it-txt span { font-size: 13px; color: var(--ink-2); }
.it-txt .own { font-size: 12px; }
.gold-t { color: var(--gold); display: inline-flex; align-items: center; gap: 3px; }
.gold-t .ic { width: 17px; height: 17px; }

/* 시트 */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; animation: fade .2s; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 560px; margin: 0 auto; max-height: 88vh; overflow-y: auto; background: var(--paper); border-radius: 22px 22px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; animation: up .25s ease-out; }
.sh-top { display: flex; align-items: center; gap: 10px; }
.sh-top .mon { width: 84px; height: 84px; flex: none; }
.concept { background: var(--foam); border-radius: 14px; padding: 14px; line-height: 1.85; border-left: 4px solid var(--isl, var(--coral)); }
.fld { display: flex; flex-direction: column; gap: 6px; }
.fld > span { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.fld input { font: inherit; font-size: 17px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--foam); color: var(--ink); }
.classes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cls { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 4px; border-radius: 14px; border: 2px solid var(--line); background: var(--foam); }
.cls .ic { width: 30px; height: 30px; color: var(--ink-2); }
.cls span { font-size: 11.5px; color: var(--ink-2); }
.cls.on { border-color: var(--coral); background: var(--coral-soft); }
.cls.on .ic { color: var(--coral); }

/* 전투 */
.battle { max-width: 560px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; }
.bt-top { display: flex; align-items: center; gap: 10px; }
.bt-name { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.bt-name b { font-family: var(--f-disp); font-weight: 400; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bt-name span { font-size: 12.5px; color: var(--ink-2); }
.hearts { display: flex; gap: 2px; }
.hearts .ic { width: 24px; height: 24px; stroke: var(--line); }
.hearts i.on .ic { fill: var(--hp); stroke: var(--hp); }

}

  if (!S.wrong.length) return h + `<section class="card empty"><div class="em-art">${monsterSVG('empty-note', '#7E9AA8', { ghost: 1 })}</div><b>아직 틀린 문제가 없어</b><p>전투에서 틀린 문제는 자동으로 여기에 저장돼. 지도로 가서 첫 전투를 시작해 봐!</p><button class="btn ghost" data-act="go" data-v="map">지도로 가기</button></section>`;

function dexView() {
  const list = [];
  ISLANDS.forEach(I => { I.stages.forEach(s => list.push({ k: s.id, nm: s.mon, sub: s.name, c: monColor(s.id), got: S.dex[s.id] })); list.push({ k: I.id + '-boss', nm: I.boss, sub: I.name + ' 보스', c: I.color, got: S.boss[I.id], boss: 1 }); });
  list.push({ k: 'final-boss', nm: FINAL.boss, sub: '최종 보스', c: FINAL.color, got: S.final, boss: 1 });
  const got = list.filter(x => x.got).length;
  return `<section class="pg-head"><h1>몬스터 도감</h1><p>물리친 몬스터가 도감에 기록돼. <b>${got} / ${list.length}</b> 발견</p><div class="bar"><i style="width:${got / list.length * 100}%"></i></div></section><div class="dex">${list.map(x => `<div class="dx ${x.got ? '' : 'no'}" style="--isl:${x.c}">${monsterSVG(x.k, x.c, { boss: x.boss, sil: !x.got })}<b>${x.got ? x.nm : '???'}</b><span>${x.sub}</span></div>`).join('')}</div>`;
}

/* ───────── 전투 ───────── */
function pickQ() {
  let sid, v = null;
  if (B.mode === 'stage') sid = B.sid;
  else if (B.mode === 'boss') sid = pick(ISL[B.isl].stages).id;
  else if (B.mode === 'final') sid = pick(pick(ISLANDS).stages).id;
  else if (B.mode === 'review') { const w = B.queue[B.qi % B.queue.length]; sid = w.sid; v = w.v; B.curW = w.k; }
  const G = STAGE[sid].isl.G[sid];
  let q, tries = 0;
  do {
    const vi = v !== null && G[v] ? v : Math.floor(Math.random() * G.length);
    if (v === null && G.length > 1 && vi === B.lastV && tries < 3) { tries++; continue; }
    q = G[vi](); q.sid = sid; q.v = vi; tries++;
  } while ((!q || B.seen.has(q.p)) && tries < 8);
  B.seen.add(q.p); B.lastV = q.v;
  return q;
}
function startBattle(mode, id) {
  sheet = null;
  const dmg = 20;
  if (mode === 'stage') { const s = STAGE[id]; B = { mode, sid: id, isl: s.isl.id, name: s.mon, sub: s.name, color: monColor(id), key: s.id, maxHp: 100 }; }
  if (mode === 'boss') { const I = ISL[id]; B = { mode, isl: id, name: I.boss, sub: I.name + ' 보스', color: I.color, key: I.id + '-boss', boss: 1, maxHp: 160 }; }
  if (mode === 'final') { B = { mode, name: FINAL.boss, sub: '최종 결전', color: FINAL.color, key: 'final-boss', boss: 1, maxHp: 240 }; }
  if (mode === 'review') { const queue = S.wrong.slice(-8).map(w => ({ k: w.k, sid: w.sid, v: w.v })); B = { mode, queue, name: '부활한 오답 몬스터', sub: '복습 전투', color: '#6E8796', key: 'review-ghost', ghost: 1, maxHp: queue.length * dmg }; }
  Object.assign(B, { hp: B.maxHp, hearts: 3, combo: 0, best: 0, wrongs: 0, qi: 0, seen: new Set(), lastV: -1, inp: '', phase: 'ask', xp: 0, gold: 0, feather: false, hintShown: false, nRight: 0 });
  if (S.items.feather > 0 && mode !== 'review') { S.items.feather--; B.feather = true; save(); }
  B.q = pickQ();
  render(); window.scrollTo(0, 0);
}
function battleHTML() {
  const q = B.q; const hpP = Math.max(0, B.hp / B.maxHp * 100);
  let h = `<div class="battle" style="--isl:${B.color}">
  <div class="bt-top"><button class="icon-btn" data-act="flee" aria-label="후퇴">${ICON.back}</button><div class="bt-name"><b>${B.name}</b><span>${B.sub}</span></div><div class="hearts" aria-label="하트 ${B.hearts}개">${[0, 1, 2].map(i => `<i class="${i < B.hearts ? 'on' : ''}">${ICON.heart}</i>`).join('')}</div></div>
  <div class="hp"><i style="width:${hpP}%"></i><span>HP ${Math.max(0, B.hp)} / ${B.maxHp}</span></div>
  <div class="arena" id="arena"><div class="mon-wrap" id="mon">${monsterSVG(B.key, B.color, { boss: B.boss, ghost: B.ghost })}</div><div id="fx"></div>${B.combo >= 2 ? `<div class="combo">콤보 ×${B.combo}</div>` : ''}${B.feather ? '<div class="buff">XP ×2</div>' : ''}</div>`;
  if (B.phase === 'end') return h + endHTML() + '</div>';
  h += `<section class="qcard"><div class="q-meta"><span>문제 ${B.qi + 1}</span><span class="tag">${STAGE[q.sid].name}</span></div><div class="q-p">${q.p}</div>${q.fig ? `<div class="fig-wrap">${q.fig}</div>` : ''}${B.hintShown ? `<div class="hintbox">${ICON.scroll}<span>${q.hint}</span></div>` : ''}</section>`;
  if (B.phase === 'ask') {
    if (q.kind === 'choice') h += `<div class="choices">${q.opts.map((o, i) => `<button class="ch" data-act="choose" data-i="${i}"><span class="ci">${'①②③④⑤'[i]}</span><span class="co">${o}</span></button>`).join('')}</div>`;
    else h += `<div class="ansline">${q.pre ? `<span class="pre">${q.pre}</span>` : ''}<span class="inbox" id="inbox">${inputHTML(B.inp)}</span>${q.unit ? `<span class="unit">${q.unit}</span>` : ''}</div>
      <div class="pad">${['7', '8', '9', 'del', '4', '5', '6', '-', '1', '2', '3', '/', '0', '.', 'ok'].map(k => k === 'del' ? `<button data-act="key" data-k="del" aria-label="지우기">⌫</button>` : k === 'ok' ? `<button class="ok" data-act="submit">공격!</button>` : k === '-' ? `<button data-act="key" data-k="-" aria-label="음수 부호">${MI}</button>` : k === '/' ? `<button data-act="key" data-k="/" aria-label="분수">${fr('□', '□')}</button>` : `<button data-act="key" data-k="${k}">${k}</button>`).join('')}</div>`;
    h += `<div class="tools"><button class="tool" data-act="hint" ${S.items.hint && !B.hintShown ? '' : 'disabled'}>${ICON.scroll}힌트 <b>${S.items.hint}</b></button><button class="tool" data-act="potion" ${S.items.potion && B.hearts < 3 ? '' : 'disabled'}>${ICON.potion}물약 <b>${S.items.potion}</b></button></div>`;
  } else if (B.phase === 'fb') {
    const ok = B.last.ok;
    if (q.kind === 'choice') h += `<div class="choices done">${q.opts.map((o, i) => `<div class="ch ${i === q.ci ? 'right' : i === B.last.pick ? 'wrong' : ''}"><span class="ci">${'①②③④⑤'[i]}</span><span class="co">${o}</span></div>`).join('')}</div>`;
    h += `<section class="fb ${ok ? 'good' : 'bad'}"><div class="fb-h">${ok ? `<b>${B.last.crit ? '치명타!' : '명중!'}</b> ${CLS[S.cls].atk} ${MI}${B.last.dmg}` : '<b>앗, 반격당했어!</b> 하트 1개를 잃었어'}</div>
      ${q.kind === 'num' ? `<div class="fb-a">${ok ? '' : `<span class="lbl bad">내 답</span>${B.last.myHTML}<br>`}<span class="lbl good">정답</span>${ansHTML(q)}</div>` : ''}
      ${B.last.note ? `<div class="fb-note">${B.last.note}</div>` : ''}
      ${ok && !B.showSteps ? `<button class="link" data-act="steps">풀이 보기</button>` : `<ol class="steps">${dedupe(q.steps).map(x => `<li>${x}</li>`).join('')}</ol>`}
      <button class="btn big" data-act="next">${B.hp <= 0 || B.hearts <= 0 ? '결과 보기' : '다음 문제'}</button></section>`;
  }
  return h + '</div>';
}
function dedupe(a) { return a.filter((x, i) => x && x !== a[i - 1]); }
function endHTML() {
  const win = B.result === 'win';
  const st = B.stars || 0;
  return `<section class="end ${win ? 'win' : 'lose'}"><h2>${win ? (B.mode === 'review' ? '복습 완료!' : '승리!') : '후퇴…'}</h2>
    ${win && B.mode === 'stage' ? `<div class="big-stars">${[0, 1, 2].map(k => `<i class="${k < st ? 'on' : ''}" style="animation-delay:${k * 0.18}s">${ICON.star}</i>`).join('')}</div>` : ''}
    <p>${win ? (B.mode === 'review' ? `오답 몬스터를 물리쳤어. ${B.grad ? `<b>${B.grad}문제</b>가 오답노트에서 졸업했어!` : '한 번 더 맞히면 졸업이야.'}` : `<b>${B.name}</b> 격파! 틀린 문제 ${B.wrongs}개 · 최고 콤보 ${B.best}`) : `하트를 모두 잃었어. 틀린 문제는 오답노트에 저장됐어. 개념을 한 번 보고 다시 도전해 봐!`}</p>
    <div class="gain"><span>${ICON.star} 경험치 +${B.xp}</span><span class="gold-t">${ICON.coin} 골드 +${B.gold}</span></div>
    <div class="row col">${win ? '' : B.mode === 'stage' ? `<button class="btn big" data-act="brief-again">개념 보고 다시 도전</button>` : ''}<button class="btn ${win ? 'big' : 'ghost'}" data-act="again">${win ? '한 번 더' : '바로 다시 도전'}</button><button class="btn ghost" data-act="leave">${B.mode === 'review' ? '오답노트로' : B.mode === 'final' ? '지도로' : '섬으로 돌아가기'}</button></div></section>`;
}
function afterBattleRender() {
  const ib = $('#inbox'); if (ib) ib.classList.toggle('empty', !B.inp);
}
function fx(kind, text, crit) {
  const box = $('#fx'), mon = $('#mon'); if (!box || !mon) return;
  if (kind === 'hit') {
    const e = document.createElement('div'); e.className = 'fx ' + CLS[S.cls].fx; box.appendChild(e);
    const n = document.createElement('div'); n.className = 'dmg' + (crit ? ' crit' : ''); n.textContent = text; box.appendChild(n);
    mon.classList.remove('hurt'); void mon.offsetWidth; mon.classList.add('hurt');
  } else {
    mon.classList.remove('lunge'); void mon.offsetWidth; mon.classList.add('lunge');
    const ar = $('#arena'); ar.classList.remove('shake'); void ar.offsetWidth; ar.classList.add('shake');
  }
}
function answer(ok, myHTML, pickI, note) {
  const q = B.q; S.tot.s++;
  const st = S.stats[q.sid] = S.stats[q.sid] || { c: 0, w: 0 };
  B.last = { ok, myHTML, pick: pickI, note };
  if (ok) {
    st.c++; S.tot.c++; B.nRight++; markDaily();
    B.combo++; B.best = Math.max(B.best, B.combo);
    const crit = B.combo >= 3 && B.mode !== 'review'; const dmg = crit ? 30 : 20;
    B.hp -= dmg; B.last.dmg = dmg; B.last.crit = crit;
    const xp = (10 + 2 * Math.min(B.combo, 5)) * (B.feather ? 2 : 1); const g = crit ? 5 : 3;
    B.xp += xp; B.gold += g; S.gold += g; gainXP(xp);
    if (B.mode === 'review') { const w = S.wrong.find(x => x.k === B.curW); if (w) { w.fix++; if (w.fix >= 2) { S.wrong = S.wrong.filter(x => x !== w); B.grad = (B.grad || 0) + 1; } } }
    crit ? SFX.crit() : SFX.hit();
  } else {
    st.w++; B.combo = 0; B.hearts--; B.wrongs++;
    if (B.mode !== 'review') {
      S.wrong.push({ k: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), sid: q.sid, v: q.v, q: { p: q.p, fig: q.fig || '', steps: dedupe(q.steps) }, my: myHTML, ans: ansHTML(q), t: Date.now(), fix: 0 });
      if (S.wrong.length > 40) S.wrong = S.wrong.slice(-40);
    }
    SFX.miss();
  }
  B.phase = 'fb'; B.showSteps = !ok; save(); render();
  if (ok) fx('hit', MI + B.last.dmg, B.last.crit); else fx('miss');
  if (ok) { clearTimeout(B.autoT); B.autoT = setTimeout(() => { if (B && B.phase === 'fb' && !B.showSteps) next(); }, 1500); }
}
function next() {
  clearTimeout(B.autoT);
  if (B.hp <= 0) return finish('win');
  if (B.hearts <= 0) return finish('lose');
  B.qi++; B.inp = ''; B.hintShown = false; B.phase = 'ask'; B.showSteps = false;
  B.q = pickQ(); render();
  const qc = document.querySelector('.qcard'); if (qc && qc.getBoundingClientRect().top < 0) qc.scrollIntoView({ block: 'start' });
}
function finish(res) {
  B.result = res; B.phase = 'end';
  if (res === 'win') {
    SFX.win();
    if (B.mode === 'stage') {
      const stars = B.wrongs === 0 ? 3 : B.wrongs === 1 ? 2 : 1; B.stars = stars;
      const prev = S.stars[B.sid] || 0; S.stars[B.sid] = Math.max(prev, stars); S.dex[B.sid] = true;
      let g = 10 * stars + (stars === 3 && prev < 3 ? 20 : 0); const xp = 20 * stars * (B.feather ? 2 : 1);
      B.gold += g; S.gold += g; B.xp += xp; gainXP(xp);
    } else if (B.mode === 'boss') {
      const first = !S.boss[B.isl]; S.boss[B.isl] = true; const g = first ? 60 : 20, xp = (first ? 150 : 60) * (B.feather ? 2 : 1);
      B.gold += g; S.gold += g; B.xp += xp; gainXP(xp);
      if (first) toast(`<b>${ISL[B.isl].name} 정복!</b> 보스가 도감에 등록됐어`, 'gold');
    } else if (B.mode === 'final') {
      const first = !S.final; S.final = true; const g = first ? 150 : 40, xp = (first ? 300 : 100) * (B.feather ? 2 : 1);
      B.gold += g; S.gold += g; B.xp += xp; gainXP(xp);
    } else if (B.mode === 'review') { const g = 15; B.gold += g; S.gold += g; }
  } else SFX.lose();
  save(); render(); window.scrollTo(0, 0);
}
function leaveBattle() {
  const back = B.mode === 'review' ? { name: 'notebook' } : B.mode === 'final' ? { name: 'map' } : { name: 'island', id: B.isl };
  clearTimeout(B.autoT); B = null; view = back; render(); window.scrollTo(0, 0);
}
function submitNum() {
  if (!B || B.phase !== 'ask' || B.q.kind !== 'num') return;
  const p = parseAns(B.inp);
  if (!p) { const ib = $('#inbox'); if (ib) { ib.classList.remove('nudge'); void ib.offsetWidth; ib.classList.add('nudge'); } return; }
  const ok = qeq(p.q, B.q.ans);
  let note = '';
  if (ok && p.raw && gcd(p.raw[0], p.raw[1]) > 1) note = `정답! 그런데 기약분수로 쓰면 ${M(qh(B.q.ans))}이야. 시험에서는 기약분수로 쓰자.`;
  answer(ok, `${B.q.pre ? B.q.pre + ' ' : ''}${M(inputHTML(B.inp))}${B.q.unit ? ' ' + B.q.unit : ''}`, null, note);
}
function keyIn(k) {
  if (!B || B.phase !== 'ask' || B.q.kind !== 'num') return;
  let s = B.inp;
  if (k === 'del') s = s.slice(0, -1);
  else if (k === '-') { s = s.startsWith('-') ? s.slice(1) : '-' + s; }
  else if (k === '/') { if (!s.includes('/') && !s.includes('.') && /\d$/.test(s)) s += '/'; }
  else if (k === '.') { const part = s.split('/').pop(); if (!s.includes('/') && !part.includes('.')) s += (/\d$/.test(s) ? '' : '0') + '.'; }
  else if (/^\d$/.test(k)) { if (s.replace(/[^\d]/g, '').length < 9) s += k; }
  B.inp = s; const ib = $('#inbox'); if (ib) { ib.innerHTML = inputHTML(s); ib.classList.toggle('empty', !s); }
}

/* ───────── 이벤트 ───────── */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, id = el.dataset.id;
  const A = {
    go: () => { view = { name: el.dataset.v }; sheet = null; render(); window.scrollTo(0, 0); },
    island: () => { view = { name: 'island', id }; render(); window.scrollTo(0, 0); },
    brief: () => { sheet = { type: 'brief', id }; render(); },
    close: () => { sheet = null; render(); },
    fight: () => startBattle('stage', id),
    boss: () => { if (bossOpen(ISL[id])) startBattle('boss', id); else toast('스테이지를 모두 별 1개 이상으로 깨면 보스가 나타나.'); },
    final: () => { if (finalOpen()) startBattle('final'); else toast(`9개 섬의 보스를 모두 물리치면 열려 (${Object.keys(S.boss).length}/9)`); },
    review: () => startBattle('review'),
    'intro-ok': () => { S.intro = true; save(); render(); },
    claim: () => { if (S.daily.date === today() && S.daily.c >= DAILY_GOAL && !S.daily.claimed) { S.daily.claimed = true; S.gold += 30; SFX.coin(); toast('<b>퀘스트 완료!</b> 골드 30을 받았어', 'gold'); save(); render(); } },
    profile: () => { sheet = { type: 'profile', cls: S.cls }; render(); setTimeout(() => { const i = $('#pf-name'); if (i) i.focus(); }, 30); },
    'pick-cls': () => { const nm = $('#pf-name') ? $('#pf-name').value : S.name; sheet.cls = id; render(); const i = $('#pf-name'); if (i) i.value = nm; },
    'save-profile': () => { const nm = ($('#pf-name').value || '').trim().slice(0, 10); S.name = nm || '모험가'; S.cls = sheet.cls; S.intro = true; sheet = null; save(); render(); toast(`<b>${esc(S.name)}</b> ${CLS[S.cls].n}, 출발!`); },
    sound: () => { S.sound = !S.sound; save(); render(); if (S.sound) SFX.coin(); },
    reset: () => { view.reset = true; render(); },
    'reset-no': () => { view.reset = false; render(); },
    'reset-yes': () => { const keep = { name: S.name, cls: S.cls, sound: S.sound }; S = Object.assign(DEF(), keep, { intro: true }); view = { name: 'records' }; save(); render(); toast('기록을 처음부터 다시 시작해.'); },
    buy: () => { const it = SHOP.find(x => x.id === id); if (S.gold >= it.price) { S.gold -= it.price; S.items[id] = (S.items[id] || 0) + 1; SFX.coin(); save(); render(); toast(`<b>${it.name}</b> 구입!`); } },
    choose: () => { if (B.phase !== 'ask') return; const i = +el.dataset.i; answer(i === B.q.ci, B.q.opts[i], i); },
    key: () => keyIn(el.dataset.k),
    submit: () => submitNum(),
    hint: () => { if (S.items.hint > 0 && !B.hintShown) { S.items.hint--; B.hintShown = true; save(); render(); } },
    potion: () => { if (S.items.potion > 0 && B.hearts < 3) { S.items.potion--; B.hearts++; save(); render(); toast('하트 1개 회복!'); } },
    steps: () => { clearTimeout(B.autoT); B.showSteps = true; render(); },
    next: () => next(),
    flee: () => { if (B.phase === 'end' || confirmFlee) { confirmFlee = false; leaveBattle(); } else { confirmFlee = true; toast('한 번 더 누르면 후퇴해. 지금까지 얻은 경험치와 골드는 남아.'); setTimeout(() => confirmFlee = false, 2500); } },
    again: () => { const m = B.mode, i = B.mode === 'stage' ? B.sid : B.isl; startBattle(m, i); },
    'brief-again': () => { const sid = B.sid; leaveBattle(); sheet = { type: 'brief', id: sid }; render(); },
    leave: () => leaveBattle(),
  };
  if (A[a]) A[a]();
});
let confirmFlee = false;
document.addEventListener('keydown', e => {
  if (!B) { if (e.key === 'Escape' && sheet) { sheet = null; render(); } if (e.key === 'Enter' && sheet && sheet.type === 'profile' && e.target.id === 'pf-name') { e.preventDefault(); $('[data-act="save-profile"]').click(); } return; }
  if (e.target && e.target.tagName === 'INPUT') return;
  if (B.phase === 'ask') {
    if (B.q.kind === 'num') {
      if (/^\d$/.test(e.key)) keyIn(e.key);
      else if (e.key === '-' || e.key === '−') keyIn('-');
      else if (e.key === '/') { e.preventDefault(); keyIn('/'); }
      else if (e.key === '.') keyIn('.');
      else if (e.key === 'Backspace') { e.preventDefault(); keyIn('del'); }
      else if (e.key === 'Enter') { e.preventDefault(); submitNum(); }
    } else if (/^[1-4]$/.test(e.key)) { const i = +e.key - 1; if (i < B.q.opts.length) answer(i === B.q.ci, B.q.opts[i], i); }
  } else if (B.phase === 'fb' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); next(); }
});

render();
initRemote();
</script>
